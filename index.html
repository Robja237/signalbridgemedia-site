<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignalBridge | High-Velocity Showroom Media</title>
  <!-- Google Tech Font Import: Orbitron & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a12;
      --card-bg: rgba(15, 23, 42, 0.72);
      --text: #f8fafc;       /* Icy Titanium White */
      --muted: #cbd5e1;      /* Crisp Silver Subtext */
      --accent: #38bdf8;     /* Electric Studio Cyan LED Glow */
      --accent2: #f97316;    /* Amber LED Accent */
      --line: rgba(56, 189, 248, 0.25); /* Cyan Tinted Joint Line */
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: linear-gradient(180deg, rgba(7, 10, 18, 0.65) 0%, rgba(7, 10, 18, 0.78) 100%), 
                        url('site-bg.jpg');
      background-repeat: repeat;
      background-size: 250px 250px;
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      padding: 0;
      margin: 0;
    }

    header {
      padding: 22px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(7, 10, 18, 0.8) 0%, rgba(7, 10, 18, 0.9) 100%), 
                  url('hero-bg.jpg') center/cover no-repeat;
    }

    /* Slick Tech Logo Styling */
    .logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.6), 0 0 30px rgba(56, 189, 248, 0.2);
    }

    .logo span {
      color: var(--accent2);
      text-shadow: 0 0 18px rgba(249, 115, 22, 0.7), 0 0 35px rgba(249, 115, 22, 0.3);
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Hero Section with Vibrant Background Atmosphere */
    .hero {
      text-align: center;
      padding: 85px 20px;
      background: linear-gradient(180deg, rgba(7, 10, 18, 0.55) 0%, rgba(7, 10, 18, 0.82) 100%), 
                  url('hero-bg.jpg') center/cover no-repeat;
      border-radius: 16px;
      border: 1px solid var(--line);
      margin-bottom: 40px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.15), var(--shadow);
    }

    .hero-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.18);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.45);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    }

    .hero h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 20px;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 680px;
      margin: 0 auto 30px auto;
    }

    .section {
      margin: 60px 0;
    }

    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* Brighter Section Cards */
    .card {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.75) 0%, rgba(7, 10, 18, 0.85) 100%), 
                  url('hero-bg.jpg') center/cover no-repeat;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px;
      box-shadow: var(--shadow);
    }

    /* Video Player Shell Styled for Studio Atmosphere */
    .video-shell {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 20px rgba(56, 189, 248, 0.2);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .video-shell:hover {
      border-color: var(--accent);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.35);
    }

    video {
      object-fit: cover;
      width: 100%;
      height: 100%;
      display: block;
      accent-color: var(--accent);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    /* Feature Cards Matching Studio Backdrop */
    .feature-card {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.72) 0%, rgba(7, 10, 18, 0.82) 100%), 
                  url('hero-bg.jpg') center/cover no-repeat;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .feature-num {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--accent);
      margin-bottom: 8px;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .cta-button {
      display: inline-block;
      background: var(--accent);
      color: #070a12;
      font-weight: 800;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
